<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Café POS</title>
</head>
<body>
  <h1>Welcome to Café POS</h1>
  <form id="orderForm">
    <label>Item: <input type="text" name="items" required></label><br>
    <label>Total: <input type="number" name="total" required></label><br>
    <button type="submit">Place Order</button>
  </form>

  <p id="result"></p>

  <script>
    const form = document.getElementById('orderForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const items = form.items.value;
      const total = form.total.value;

      const res = await fetch('/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items, total })
      });

      const data = await res.json();
      document.getElementById('result').textContent =
        data.orderId ? `Order placed! ID: ${data.orderId}` : `Error: ${data.error}`;
    });
  </script>
</body>
</html>
